#version '3.8'
#MongoDB 5.0 + requires a CPU with AVS support => sử dụng image: mongo:4.4
services:
  db-mongo:
    image: mongo:6.0.6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - 27017:27017
    volumes:
      - mongodb:/data/db
    expose:
      - 27017

  # build be
  be-nest:
    # nói build: phạm vi cùng cấp với docker compose
    build:
      context: .
      dockerfile: Dockerfile
    # restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MONGODB_URL=mongodb://root:123456@db-mongo:27017/hoidanit?authSource=admin

    expose:
      - 8080
    ports:
      - 8080:8080

# chạy lại docker -> ko làm mất dữ liệu
volumes:
  mongodb:

# docker compose -p hoidanit-nest up -d
